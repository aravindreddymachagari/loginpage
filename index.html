<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page html</title>
    <style>  
    body {
        background-color: cadetblue;
    }
    @keyframes colorani {
        0% {
            color: maroon;
        }
        50% {
            color: yellow;
        }
        100% {
            color: whitesmoke;
        }
    }
    h1 {
        animation-name: colorani;
        animation-duration: 5s;
        animation-delay: 2s;
        animation-iteration-count: infinite;
    }

    body {
        background: linear-gradient(to right,cadetblue,lightblue,rgb(109, 165, 177));
    }

    </style>
</head>
<body>
    <h1>Login page with Animation and Gradient</h1>
    <br>
    <hr>
    <form>
        <fieldset>
    <legend>Login page</legend>
        <label for="name">User Name:</label>
        <input type="Name" id="name" placeholder="Enter your name">
        <br>
        <br>
        <label for="pas">Password:</label>
        <input type="password" id="pas">
        <br>
        <br>

        <button type="submit">Submit</button>
        </fieldset>
    </form>
    
</body>
</html>
